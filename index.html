<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Is My Pet Committing Tax Fraud? — Official Audit Quiz</title>
<meta name="description" content="Take the official 8-question audit to determine whether your pet is committing tax fraud. Results in under 60 seconds." />
<meta property="og:title" content="Is My Pet Committing Tax Fraud?" />
<meta property="og:description" content="The internet's only certified pet tax fraud detection questionnaire." />
<meta property="og:type" content="website" />
<style>
  :root {
    --background: oklch(0.94 0.04 85);
    --foreground: oklch(0.22 0.04 50);
    --card: oklch(0.985 0.015 90);
    --muted: oklch(0.9 0.04 85);
    --muted-foreground: oklch(0.45 0.04 60);
    --primary: oklch(0.35 0.13 25);
    --primary-foreground: oklch(0.98 0.02 90);
    --accent: oklch(0.78 0.16 65);
    --accent-foreground: oklch(0.22 0.05 40);
    --destructive: oklch(0.5 0.22 28);
    --ink: oklch(0.22 0.04 50);
    --stamp: oklch(0.5 0.22 28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--background);
    color: var(--foreground);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 31px, color-mix(in oklab, var(--ink) 8%, transparent) 31px 32px),
      radial-gradient(circle at 20% 10%, color-mix(in oklab, var(--ink) 6%, transparent), transparent 40%),
      radial-gradient(circle at 80% 90%, color-mix(in oklab, var(--ink) 6%, transparent), transparent 40%);
    min-height: 100vh;
    padding: 2.5rem 1rem;
  }
  h1, h2, h3 { font-family: "Courier New", ui-monospace, monospace; letter-spacing: 0.02em; }
  .container { max-width: 42rem; margin: 0 auto; }
  header { text-align: center; margin-bottom: 2rem; }
  .badge {
    display: inline-block;
    border: 2px solid var(--foreground);
    padding: 0.25rem 0.75rem;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--muted-foreground);
    margin-bottom: 0.75rem;
    font-family: "Courier New", monospace;
  }
  h1 {
    font-size: clamp(1.875rem, 5vw, 3rem);
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .subtitle {
    max-width: 28rem;
    margin: 1rem auto 0;
    font-style: italic;
    color: var(--muted-foreground);
    font-size: 0.95rem;
  }
  .card {
    position: relative;
    border-radius: 0.375rem;
    border: 2px solid var(--foreground);
    background: var(--card);
    padding: 1.5rem;
    box-shadow: 6px 6px 0 0 var(--ink);
  }
  @media (min-width: 768px) { .card { padding: 2.5rem; } }
  .meta {
    display: flex;
    justify-content: space-between;
    font-family: "Courier New", monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted-foreground);
    margin-bottom: 1.5rem;
  }
  .progress { height: 0.5rem; width: 100%; background: var(--muted); border-radius: 9999px; overflow: hidden; margin-bottom: 1.5rem; }
  .progress > div { height: 100%; background: var(--primary); transition: width .3s; }
  .question { font-size: 1.25rem; font-weight: bold; margin-bottom: 1.5rem; line-height: 1.35; font-family: inherit; }
  @media (min-width: 768px) { .question { font-size: 1.5rem; } }
  .options { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
  .opt {
    width: 100%;
    border: 2px solid var(--foreground);
    background: var(--background);
    padding: 0.75rem 1rem;
    text-align: left;
    font: inherit;
    font-weight: 500;
    border-radius: 0.25rem;
    cursor: pointer;
    transition: all .15s;
  }
  .opt:hover { transform: translateY(-2px); background: var(--accent); color: var(--accent-foreground); box-shadow: 3px 3px 0 0 var(--ink); }
  .letter { display: inline-block; margin-right: 0.75rem; font-family: "Courier New", monospace; font-size: 0.875rem; color: var(--muted-foreground); }
  .result { text-align: center; }
  .label {
    font-family: "Courier New", monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted-foreground);
    margin-bottom: 1rem;
  }
  .stamp {
    color: var(--stamp);
    border: 4px double var(--stamp);
    padding: 0.4rem 1rem;
    font-family: "Courier New", monospace;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    transform: rotate(-8deg);
    display: inline-block;
    opacity: 0.92;
    margin-bottom: 1.5rem;
  }
  .verdict { font-size: clamp(2rem, 6vw, 3rem); font-weight: 900; text-transform: uppercase; margin-bottom: 1rem; }
  .verdict.guilty { color: var(--destructive); }
  .verdict.warn { color: var(--primary); }
  .body-text { max-width: 28rem; margin: 0 auto; color: var(--muted-foreground); font-size: 1rem; line-height: 1.6; }
  .score { margin-top: 1.5rem; font-family: "Courier New", monospace; font-size: 0.875rem; color: var(--muted-foreground); }
  .reset {
    margin-top: 2rem;
    border: 2px solid var(--foreground);
    background: var(--primary);
    color: var(--primary-foreground);
    padding: 0.75rem 1.5rem;
    font-family: "Courier New", monospace;
    font-size: 0.875rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-radius: 0.25rem;
    cursor: pointer;
    transition: all .15s;
  }
  .reset:hover { transform: translateY(-2px); box-shadow: 3px 3px 0 0 var(--ink); }
  footer {
    margin-top: 2.5rem;
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted-foreground);
  }
</style>
</head>
<body>
  <main class="container">
    <header>
      <div class="badge">Form 1040-PAW · Rev. 2026</div>
      <h1>Is My Pet Committing<br />Tax Fraud?</h1>
      <p class="subtitle">The internet's only certified questionnaire for detecting fiscal malfeasance in domestic animals. Answer honestly. They are watching.</p>
    </header>
    <section class="card" id="card"></section>
    <footer>Department of Pet Revenue · Not affiliated with any actual government</footer>
  </main>

<script>
const QUESTIONS = [
  { q: "Does your pet disappear for unexplained periods of time?", a: [
    { label: "Never, they're always loafing on the couch", score: 0 },
    { label: "Occasionally, for a 'nap'", score: 2 },
    { label: "Daily, with a tiny briefcase", score: 5 }]},
  { q: "Has your pet ever received mail addressed to an LLC?", a: [
    { label: "No", score: 0 },
    { label: "Once. It was suspicious.", score: 3 },
    { label: "Yes — 'Mr. Whiskers Holdings, LLC'", score: 6 }]},
  { q: "How does your pet react when you mention the word 'audit'?", a: [
    { label: "Indifferent", score: 0 },
    { label: "Ears perk up suspiciously", score: 3 },
    { label: "Knocks the laptop off the table immediately", score: 5 }]},
  { q: "Are there unexplained Amazon packages in your pet's name?", a: [
    { label: "No", score: 0 },
    { label: "A few catnip-related items", score: 2 },
    { label: "Yes, including a paper shredder", score: 6 }]},
  { q: "Has your pet claimed any dependents this year?", a: [
    { label: "Of course not, they're a pet", score: 0 },
    { label: "The houseplants, maybe", score: 2 },
    { label: "All 14 of the neighborhood squirrels", score: 5 }]},
  { q: "Does your pet maintain offshore accounts (e.g. under the couch)?", a: [
    { label: "Just buried treats", score: 1 },
    { label: "A modest sock-drawer reserve", score: 3 },
    { label: "Documented holdings in the Cayman Litter Box", score: 6 }]},
  { q: "How does your pet's 'business expense' pile look?", a: [
    { label: "What pile?", score: 0 },
    { label: "A few chewed receipts", score: 2 },
    { label: "An organized binder labeled 'DO NOT OPEN'", score: 5 }]},
  { q: "Does your pet make eye contact when you ask about their income?", a: [
    { label: "Yes, innocently", score: 0 },
    { label: "Looks away, slowly", score: 3 },
    { label: "Pretends to not speak English", score: 5 }]},
];
const MAX = QUESTIONS.reduce((s,q)=>s+Math.max(...q.a.map(x=>x.score)),0);
let step = 0, answers = [];

function verdict(score) {
  const pct = score / MAX;
  if (pct < 0.2) return { title:"CLEARED", stamp:"Not Under Investigation", body:"Your pet is a model citizen. Their finances are as clean as their freshly licked paws. Congratulations — no audit required.", tone:"clear" };
  if (pct < 0.5) return { title:"PERSON OF INTEREST", stamp:"Mild Suspicion", body:"There are irregularities. We recommend reviewing the treat ledger and monitoring all naps lasting more than four hours.", tone:"warn" };
  if (pct < 0.75) return { title:"UNDER INVESTIGATION", stamp:"Audit Recommended", body:"Strong evidence of fiscal mischief. Your pet is hiding something — possibly in a sock, possibly in Delaware. Proceed with caution.", tone:"warn" };
  return { title:"GUILTY", stamp:"Notify IRS Immediately", body:"Your pet is, beyond reasonable doubt, committing tax fraud. Do not confront them directly. They are smarter than you. They have a lawyer.", tone:"guilty" };
}

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function render() {
  const card = document.getElementById('card');
  if (step >= QUESTIONS.length) {
    const total = answers.reduce((s,n)=>s+n,0);
    const r = verdict(total);
    card.innerHTML = `
      <div class="result">
        <div class="label">Official Determination</div>
        <div><span class="stamp">${esc(r.stamp)}</span></div>
        <h2 class="verdict ${r.tone}">${esc(r.title)}</h2>
        <p class="body-text">${esc(r.body)}</p>
        <div class="score">Suspicion Score: ${total} / ${MAX}</div>
        <button class="reset" onclick="reset()">File a New Case</button>
      </div>`;
    return;
  }
  const Q = QUESTIONS[step];
  card.innerHTML = `
    <div class="meta">
      <span>Question ${step+1} / ${QUESTIONS.length}</span>
      <span>Case #PT-${1000+step}</span>
    </div>
    <div class="progress"><div style="width:${(step/QUESTIONS.length)*100}%"></div></div>
    <h2 class="question">${esc(Q.q)}</h2>
    <ul class="options">
      ${Q.a.map((opt,i)=>`<li><button class="opt" onclick="pick(${opt.score})"><span class="letter">${String.fromCharCode(65+i)}.</span>${esc(opt.label)}</button></li>`).join('')}
    </ul>`;
}
function pick(s){ answers.push(s); step++; render(); }
function reset(){ answers=[]; step=0; render(); }
render();
</script>
</body>
</html>
